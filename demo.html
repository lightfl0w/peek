<!DOCTYPE html>
<html>
<head>
  <title>peek demo</title>
  <style>
    body { color: silver; }
    body > p.head { color: hsl(210, 100%, 60%); text-align: center; text-transform: uppercase; }
    p + p { color: hsl(120, 100%, 50%); }          
    ul ~ p { font-style: italic; }                
    li:last-child { text-decoration: line-through; } 
    [data-user^="u"] { color: aqua; }           
    [data-user$="n"] { text-decoration: underline; } 
    .gone { display: none; }
    .btn { color: 231; background-color: rgb(20 90 160); padding: 2;
           font-weight: bold; width: 16; text-align: center; }
    .flat { border: none; background-color: #0a0; }
    .note { color: olive; }
  </style>
</head>
<body>
  <p class="head">css3 &amp; html5 ready</p>
  <p>rgb space syntax</p>
  <ul>
    <li>first item</li>
    <li>second item</li>
  </ul>
  <p class="note">after list, italic via ~</p>
  <p class="gone">you cannot see me</p>
  <div data-user="user1">^= prefix match</div>
  <div data-user="admin">$= suffix match</div>
  <button class="btn">OPEN</button>
  <button class="btn flat">FLAT</button>
  <hr>
  <p>entities: &lt;tag&gt; &quot;q&quot; a&nbsp;b</p>
  <script>
    console.log("peek js ready, body =", document.body.tagName);
    const note = document.querySelector(".note");
    note.textContent = "text rewritten by QuickJS";
    note.style.color = "red";
    document.querySelector(".gone").style.display = "block";
    document.querySelectorAll("li")[0].textContent = "first item (js)";
    document.querySelector("button").style.width = "22";
    console.log("p count =", document.querySelectorAll("p").length);
    alert("peek dialog: alert works");
    document.querySelectorAll("button")[0].onclick = function () {
      alert("OPEN clicked, focus was: " + this.tagName);
    };
    document.querySelectorAll("button")[1].onclick = function () {
      this.style.backgroundColor = "#c60";
      console.log("FLAT clicked");
    };
  </script>
</body>
</html>
